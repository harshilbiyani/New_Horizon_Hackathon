<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Tactical Flood Rescue</title>
    <link rel="stylesheet" href="style.css">
    <!-- Three.js + PostProcessing map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui-layer">
        <!-- Top Bar -->
        <header class="top-nav">
            <div class="logo">
                <span class="icon">⬡</span>
                <span>DRONESHIELD</span>
            </div>
            <div class="controls-top">
                <div class="dropdown">📌 Secret Base XX ▼</div>
                <div class="dropdown">🚁 Drones: 1 Active / 4 Total ▼</div>
                <div class="dropdown">⚙️ System Mode: Auto ▼</div>
            </div>
            <div class="status-top">
                <span class="alert-icon">⚠️</span>
                <span>⚙️</span>
                <span>👤</span>
            </div>
        </header>

        <!-- Main Workspace Overlay -->
        <div class="main-overlay">
            
            <!-- Left Info Panel -->
            <div class="panel left-panel">
                <div class="radar-box">
                    <div class="radar-sweep"></div>
                    <div class="radar-content">
                        <span class="danger-marker" style="top: 30%; left: 40%;">⚠️</span>
                        <span class="danger-marker" style="top: 70%; left: 20%;">⚠️</span>
                        <div class="radar-dist">286 m</div>
                    </div>
                </div>
                <div class="drone-sentry">
                    <h3>DroneSentry</h3>
                    <div class="sentry-stats">
                        <div class="stat-card">
                            <span class="icon">⬡</span>
                            <div class="details">
                                <label>RF DJI LightBridge</label>
                                <span>Frq 2465.5 MHz</span>
                                <div class="signal-bar"><span></span><span></span><span></span></div>
                            </div>
                        </div>
                    </div>
                    <div class="status-grid">
                        <div class="grid-item">
                            <label>Targets Detected</label>
                            <span class="val" id="target-count">3 Drones</span>
                        </div>
                        <div class="grid-item">
                            <label>Threat Level</label>
                            <span class="val danger">High</span>
                        </div>
                        <div class="grid-item">
                            <label>Disruption Status</label>
                            <span class="val safe">Ready</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tracking Label (JavaScript Positioned) -->
            <div class="floating-label" id="secret-base-label">
                <span class="tag">Secret Base XX</span>
                <span class="sub">The location's classified</span>
            </div>

            <!-- Right Action Panel -->
            <div class="panel right-panel">
                <div class="action-buttons">
                    <button class="btn warning"><span class="icon">⏱</span> Mark as Priority</button>
                    <button class="btn success"><span class="icon">✓</span> Whitelist</button>
                    <button class="btn danger"><span class="icon">⚡</span> Disrupt Signal</button>
                    <button class="btn danger-outline"><span class="icon">🎯</span> Engage Now</button>
                    <button class="btn dark"><span class="icon">✖</span> Cancel Target</button>
                    <div class="zoom-controls">
                        <button>+</button>
                        <button>-</button>
                    </div>
                </div>
            </div>

            <!-- Bottom Control Panel -->
            <div class="panel bottom-panel">
                <h3>Disruption Control</h3>
                <div class="control-grid">
                    <button class="btn-grid"><span class="icon">✜</span> Auto Disrupt</button>
                    <button class="btn-grid"><span class="icon">⭕</span> Pulse Burst</button>
                    <button class="btn-grid"><span class="icon">◎</span> Sweep Area</button>
                    <button class="btn-grid"><span class="icon">▦</span> Disrupt All</button>
                    <button class="btn-grid"><span class="icon">⌖</span> Disrupt Target</button>
                    <button class="btn-grid dark"><span class="icon">🖧</span> DS-X MK2</button>
                </div>
                <div class="sliders">
                    <div class="slider-row">
                        <label>Altitude</label>
                        <div class="track"></div>
                        <span>350 m</span>
                    </div>
                    <div class="slider-row">
                        <label>Pulse Power</label>
                        <div class="track"><div class="fill" style="width: 80%"></div></div>
                        <span>80%</span>
                    </div>
                    <div class="slider-row">
                        <label>Detection Radius</label>
                        <div class="track"></div>
                        <span>670 m</span>
                    </div>
                </div>
            </div>

        </div>
    </div>
    
    <!-- Setup WebGL Canvas Here -->
    <div id="webgl-container"></div>
    <script type="module" src="main.js"></script>
</body>
</html>
