<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Swarm — 3D Terrain Visualization</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Minimal Live HUD overlay -->
    <div id="ui-layer">
        <!-- Top Status Bar -->
        <div class="hud-top">
            <div class="hud-left">
                <span class="hud-badge live">● LIVE</span>
                <span class="hud-label" id="hud-drone-count">🚁 5 Drones Active</span>
            </div>
            <div class="hud-center">
                <span class="hud-title">TERRAIN VISUALIZATION</span>
            </div>
            <div class="hud-right">
                <span class="hud-label" id="hud-survivors">👤 Targets: 8</span>
                <span class="hud-label" id="hud-coverage">📡 Coverage: 0%</span>
            </div>
        </div>

        <!-- Bottom telemetry strip -->
        <div class="hud-bottom">
            <span class="hud-label" id="hud-time">⏱ Mission: 0s</span>
            <span class="hud-label" id="hud-battery">🔋 Avg Battery: 100%</span>
            <span class="hud-label" id="hud-signal">📶 Signal: 95%</span>
            <span class="hud-hint">Scroll to zoom · Drag to rotate · Right-drag to pan</span>
        </div>
    </div>

    <!-- WebGL Canvas -->
    <div id="webgl-container"></div>
    <script type="module" src="main.js"></script>
</body>
</html>
