<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Swarm — 3D Terrain Visualization</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "./libs/three.module.js",
                "three/addons/": "./libs/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="ui-layer">
        <div class="hud-top">
            <div class="hud-left">
                <span class="hud-badge live">● LIVE</span>
                <span class="hud-label" id="hud-drone-count">🚁 5 Drones Active</span>
            </div>
            <div class="hud-center">
                <span class="hud-title">TACTICAL 3D CITY THEATER</span>
                <div class="drone-quick-bar" id="drone-quick-bar">
                    <button class="drone-cam-btn active" data-drone="free">🌐 Free Cam</button>
                    <button class="drone-cam-btn" data-drone="DRN-001">🚁 DRN-1</button>
                    <button class="drone-cam-btn" data-drone="DRN-002">🚁 DRN-2</button>
                    <button class="drone-cam-btn" data-drone="DRN-003">🚁 DRN-3</button>
                    <button class="drone-cam-btn" data-drone="DRN-004">🚁 DRN-4</button>
                    <button class="drone-cam-btn" data-drone="DRN-005">🚁 DRN-5</button>
                </div>
            </div>
            <div class="hud-right">
                <span class="hud-label" id="hud-survivors">👤 Targets: 8</span>
                <span class="hud-label" id="hud-coverage">📡 Coverage: 0%</span>
                <span class="hud-label" id="hud-obstacles">🪨 Obstacles: --</span>
                <span class="hud-label" id="hud-ai-health">🧠 AI Health: --</span>
            </div>
        </div>

        <div class="sidebar">
            <h3 class="sidebar-title">TACTICAL CONTROLS</h3>

            <div class="sidebar-section">
                <h4>Engine Commands</h4>
                <div class="button-row">
                    <button id="btn-start" class="sidebar-btn start">Start</button>
                    <button id="btn-stop" class="sidebar-btn stop">Stop</button>
                    <button id="btn-reset" class="sidebar-btn reset">Reset</button>
                </div>
            </div>

            <div class="sidebar-section">
                <h4>Chaos Deployment</h4>
                <button id="btn-emp" class="sidebar-btn danger">⚡ Trigger EMP (Kill Drone)</button>

                <div class="toggle-group mt-2">
                    <label class="toggle-label">Shift+Click Action:</label>
                    <div class="radio-row">
                        <input type="radio" id="mode-survivor" name="clickMode" value="survivor" checked>
                        <label for="mode-survivor">Deploy Survivor</label>
                    </div>
                    <div class="radio-row">
                        <input type="radio" id="mode-jammer" name="clickMode" value="jammer">
                        <label for="mode-jammer">Deploy Jammer</label>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <span class="hud-hint">Hold SHIFT and click the terrain to deploy!</span>
            </div>
        </div>

    </div>

    <!-- WebGL Canvas -->
    <div id="webgl-container"></div>
    <!-- Load socket.io client -->
    <script src="http://localhost:3001/socket.io/socket.io.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
